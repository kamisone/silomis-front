name: Deployment front dev

on:
  push:
    branches: [dev]
jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: checkout project from git
        uses: actions/checkout@v2

      - name: npm install
        run: npm i

      - name: build project
        run: npm run build
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          APP_MODE: ${{ secrets.APP_MODE }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          API_BASE_URL_SERVER: https://silomis.com/api
          API_BASE_URL_BROWSER: https://silomis.com/api


      - name: Log in to docker hub registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: build docker image
        run: docker build -t mo29172/silomis_front:v${{ github.run_number }} -f ./docker/front/Dockerfile ./

      - name: push image to docker hub
        run: docker push mo29172/silomis_front:v${{ github.run_number }}

      - name: update front deploment file version
        run: sed -i -e"s/:latest/:v${{ github.run_number }}/" docker/k8s/front-deployment.yaml

      - name: copy k8s files via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: "docker/k8s/front-deployment.yaml,docker/k8s/front-cluster-ip-service.yaml,docker/k8s/front-hap.yaml,docker/k8s/front-ingress-service.yaml"
          target: "/srv/k8s/front"
          strip_components: 2
          timeout: 5m

      - name: apply k8s files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_SECOND_USER }}
          password: ${{ secrets.SERVER_SECOND_USER_PASSWORD }}
          script: |
            kubectl delete secret front-envs --ignore-not-found=true
            kubectl create secret generic front-envs \
            --from-literal NODE_ENV=${{ secrets.NODE_ENV }} \
            --from-literal PREPROD_PUBLIC_APP_URL=${{ secrets.PREPROD_PUBLIC_APP_URL }} \
            --from-literal API_BASE_URL_SERVER=${{ secrets.API_BASE_URL_SERVER }}
            kubectl apply -f /srv/k8s/front
            minikube addons enable ingressi
            echo y | docker exec -i minikube docker system prune -a --volumes
